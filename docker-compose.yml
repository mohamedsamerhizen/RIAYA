services:
  riaya-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riaya-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=riaya-sqlserver,1433;Database=RiayaDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: RIAYA
      Jwt__Audience: RIAYA
      Jwt__DurationInMinutes: 60
      Jwt__RefreshTokenDurationInDays: 7
      AdminSeed__Enabled: "true"
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      AdminSeed__FullName: ${ADMIN_FULL_NAME:-RIAYA Admin}
      DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-true}
    depends_on:
      riaya-sqlserver:
        condition: service_healthy

  riaya-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: riaya-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "14333:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
